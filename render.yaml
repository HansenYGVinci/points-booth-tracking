services:
  - type: web
    name: points-booth-tracking
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm run start
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
